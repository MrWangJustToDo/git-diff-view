# Deploys the react example to GitHub Pages.
#
# The fragile part is the artifact hand-off: `deploy-pages` does not read the uploaded file, it looks
# the artifact up in the artifact service (`@actions/artifact` -> Twirp ListArtifacts), and that
# service only lists artifacts written by a recent `upload-artifact`. `upload-pages-artifact@v3` still
# pins `upload-artifact@v4`, so the upload step reports success while the deploy step fails with
# "Found 0 artifact(s)" - the REST API lists the artifact, the service that deploy-pages queries does
# not. `upload-pages-artifact@v5` ships `upload-artifact@v7`; keep it and `deploy-pages` on the same
# v5 line, and keep the upload and the deploy in separate jobs like the upstream template does.
#
# The toolchain runs on current LTS actions/runtime: `pnpm/action-setup@v6` takes the pnpm version
# from `packageManager`, and `setup-node@v7` on Node 22 (18 is end-of-life, and v3 of both actions
# runs on the retired node16 runtime).
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: install pnpm
        # no `version` input on purpose: the action reads `packageManager` from package.json
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build:packages && pnpm run build:react
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './ui/react-example/dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
